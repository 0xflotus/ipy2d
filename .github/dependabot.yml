version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:15"
      timezone: "Europe/Berlin"
    labels:
      - "github_actions"
    open-pull-requests-limit: 5
    reviewers:
      - "0xflotus"
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: "daily"
    reviewers:
      - "0xflotus"
